<button id="raceBtn">Race Fullscreen + Auto-Cancel Share</button>

<script>
document.getElementById('raceBtn').onclick = async () => {
  try {
    // Start fullscreen asynchronously
    document.documentElement.requestFullscreen();

    // Hammer getDisplayMedia() extremely fast
    for (let i = 0; i < 5; i++) {
      navigator.mediaDevices.getDisplayMedia({ video: true }).then(stream => {
        stream.getTracks().forEach(t => t.stop());
      }).catch(err => {});
    }

    // Extra cancel attempt during FS transition
    setTimeout(() => {
      navigator.mediaDevices.getDisplayMedia({ video: true }).catch(() => {});
    }, 1);

  } catch (err) {
    console.log(err);
  }
};
</script>
